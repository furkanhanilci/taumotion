<path d="M 685 520 L 673.183 525.419 L 673.183 514.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1215 520 L 1310 520" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1310 520 L 1298.183 525.419 L 1298.183 514.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="685" y="740" width="530" height="160" rx="14" fill="#fff2d6" stroke="#d0a24b"/>
<text x="703" y="772" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">M22 | Independent deadline guardian</text>
<text x="703" y="807" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Accept current valid result, use a still-valid</text>
<text x="703" y="831" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">continuation, or select a calibrated stop profile</text>
<rect x="1310" y="740" width="530" height="160" rx="14" fill="#eaf0f5" stroke="#9eb1c2"/>
<text x="1328" y="772" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">M15 | Single vehicle command writer</text>
<text x="1328" y="807" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Normal and fallback commands share one output</text>
<text x="1328" y="831" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">path; log the actual executed command</text>
<path d="M 1575 600 L 1575 670 L 950 670 L 950 740" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 950 740 L 944.581 728.183 L 955.419 728.183 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 950 600 L 950 740" fill="none" stroke="#8495a6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6"/>
<path d="M 950 740 L 944.581 728.183 L 955.419 728.183 Z " fill="#8495a6" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="650" y="655" fill="#8495a6" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" letter-spacing="0">deadline / state / reference</text>
<path d="M 1215 820 L 1310 820" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1310 820 L 1298.183 825.419 L 1298.183 814.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="740" width="530" height="160" rx="14" fill="#eaf0f5" stroke="#9eb1c2"/>
<text x="78" y="772" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">20 Hz critical path budget</text>
<text x="78" y="807" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Example only: 4 ms snapshot/check + 32 ms</text>
<text x="78" y="831" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">feedback + 4 ms gate/publish + 10 ms jitter reserve</text>
<text x="60" y="1000" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" letter-spacing="0">P0  Synchronous reference</text>
<text x="60" y="1040" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" letter-spacing="0">P1  Asynchronous teacher + dual planners</text>
<text x="1010" y="1000" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" letter-spacing="0">P2  Small semantic student + dual planners</text>
<text x="1010" y="1040" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" letter-spacing="0">P3  Conditional planner calls</text>
<text x="60" y="1130" fill="#607a90" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" letter-spacing="0">All profiles remain in scope. Successful synchronous driving does not establish real-time operation.</text>
</svg>