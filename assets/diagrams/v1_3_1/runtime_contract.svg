<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img"><title>Runtime composition and command ownership</title>
<rect x="0" y="0" width="1900" height="1180" rx="0" fill="#f5f8fc" stroke="none"/>
<text x="60" y="65" fill="#113047" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" letter-spacing="0">Runtime composition and command ownership</text>
<text x="60" y="105" fill="#607a90" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Different model rates; one actuator writer; no blocking dependency on a late model or solver</text>
<rect x="60" y="165" width="530" height="140" rx="14" fill="#e7effa" stroke="#77a0d6"/>
<text x="78" y="197" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Scene and model services</text>
<text x="78" y="232" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Native environments and checkpoint contracts;</text>
<text x="78" y="256" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">M03/M07 can share one VLM weight service</text>
<rect x="685" y="165" width="530" height="140" rx="14" fill="#fff2d6" stroke="#d0a24b"/>
<text x="703" y="197" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">M16 | Resource and age scheduler</text>
<text x="703" y="232" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Bounded pending queue; generation IDs; periodic /</text>
<text x="703" y="256" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">EDF / AoI-event policies</text>
<rect x="1310" y="165" width="530" height="140" rx="14" fill="#e0f3ed" stroke="#67b8a3"/>
<text x="1328" y="197" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">M23 | Evidence prediction bridge</text>
<text x="1328" y="232" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Update time alignment, preserve capture time, expire</text>
<text x="1328" y="256" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">unsupported information</text>
<path d="M 590 235 L 685 235" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 685 235 L 673.183 240.419 L 673.183 229.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1215 235 L 1310 235" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1310 235 L 1298.183 240.419 L 1298.183 229.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="440" width="530" height="160" rx="14" fill="#e7effa" stroke="#77a0d6"/>
<text x="78" y="472" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Perception · A · B · semantics</text>
<text x="78" y="507" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Frequency sweeps are pilot hypotheses.</text>
<text x="78" y="531" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Measure cold, warm, co-load and renderer contention.</text>
<rect x="685" y="440" width="530" height="160" rx="14" fill="#e0f3ed" stroke="#67b8a3"/>
<text x="703" y="472" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Policy and reference validation</text>
<text x="703" y="507" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Asynchronous proposals; fresh state snapshot;</text>
<text x="703" y="531" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">geometry and uncertainty checks</text>
<rect x="1310" y="440" width="530" height="160" rx="14" fill="#e0f3ed" stroke="#67b8a3"/>
<text x="1328" y="472" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">M14 | NMPC worker</text>
<text x="1328" y="507" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Preparation + feedback measured separately; late</text>
<text x="1328" y="531" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">results cannot overwrite new generations</text>
