<path d="M 520 285 L 508.183 290.419 L 508.183 279.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 920 285 L 980 285" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 980 285 L 968.183 290.419 L 968.183 279.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1380 285 L 1440 285" fill="none" stroke="#507790" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1440 285 L 1428.183 290.419 L 1428.183 279.581 Z " fill="#507790" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="520" width="550" height="190" rx="14" fill="#e0f3ed" stroke="#67b8a3"/>
<text x="78" y="552" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Comparison classes</text>
<text x="78" y="587" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Native systems · within-model sensor ablations · fixed</text>
<text x="78" y="611" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">candidates · matched K · matched compute · shared</text>
<text x="78" y="635" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">controller</text>
<rect x="675" y="520" width="550" height="190" rx="14" fill="#eee8f7" stroke="#a48dc7"/>
<text x="693" y="552" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Preserved research scope</text>
<text x="693" y="587" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">RQ1–RQ11; E1–E24 and E10-H.</text>
<text x="693" y="611" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Critic, multi-target, visibility, strong challengers and</text>
<text x="693" y="635" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">compute studies retained.</text>
<rect x="1290" y="520" width="550" height="190" rx="14" fill="#e0f3ed" stroke="#67b8a3"/>
<text x="1308" y="552" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Attribution and statistics</text>
<text x="1308" y="587" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Paired routes/seeds; cluster intervals; raw proposal,</text>
<text x="1308" y="611" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">supervisor, NMPC, guardian and executed action</text>
<rect x="60" y="825" width="1780" height="170" rx="14" fill="#eaf0f5" stroke="#9eb1c2"/>
<text x="78" y="857" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">Evidence levels — current runtime state: NOT RUN</text>
<text x="78" y="892" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">D0 Specification checks / S0 Source inspection / R1 Native inference / R2 Adapter parity</text>
<text x="78" y="916" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">R3 Runtime integration / R4 Closed-loop evaluation / R5 Hardware-specific real-time profile</text>
</svg>