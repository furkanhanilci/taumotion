<text x="57.050000000000004" y="110.10000000000001" fill="#527084" font-family="DejaVu Sans,sans-serif" font-size="5.44" font-weight="700" letter-spacing="2.04">MOTION</text>
<text x="185" y="65" fill="#113047" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" letter-spacing="0">Learning and evidence maturity</text>
<text x="185" y="105" fill="#607a90" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Offline initialization → closed-loop pilot → tail-risk study; document checks never imply runtime validation</text>
<rect x="60" y="180" width="400" height="210" rx="14" fill="#e7effa" stroke="#77a0d6"/>
<text x="78" y="212" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">1 | Native parity and</text>
<text x="78" y="240" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">profiling</text>
<text x="78" y="275" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Official checkpoints; adapter</text>
<text x="78" y="299" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">equivalence; joint inference and control</text>
<text x="78" y="323" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">timing</text>
<rect x="520" y="180" width="400" height="210" rx="14" fill="#eee8f7" stroke="#a48dc7"/>
<text x="538" y="212" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">2 | Offline initialization</text>
<text x="538" y="247" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Shared candidate cache; supervised</text>
<text x="538" y="271" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">ranking; horizon-student distillation</text>
<rect x="980" y="180" width="400" height="210" rx="14" fill="#fff2d6" stroke="#d0a24b"/>
<text x="998" y="212" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">3 | Small closed-loop PPO</text>
<text x="998" y="240" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">pilot</text>
<text x="998" y="275" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Masks, recurrent state, hybrid log-prob,</text>
<text x="998" y="299" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">reward and shared supervisor</text>
<rect x="1440" y="180" width="400" height="210" rx="14" fill="#fff2d6" stroke="#d0a24b"/>
<text x="1458" y="212" fill="#13344b" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" letter-spacing="0">4 | CVaR pilot and full study</text>
<text x="1458" y="247" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Policy-versioned episodes; quantile</text>
<text x="1458" y="271" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">stability, tail uncertainty and compute</text>
<text x="1458" y="295" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">budget</text>
