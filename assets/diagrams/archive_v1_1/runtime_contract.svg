<text x="78" y="807" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Example only: 4 ms snapshot/check + 32 ms</text>
<text x="78" y="831" fill="#4b697e" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" letter-spacing="0">feedback + 4 ms gate/publish + 10 ms jitter reserve</text>
